name: Web checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check service-worker.js
      - run: node --test tests/*.test.cjs tests/*.test.mjs
      - run: python3 -m py_compile tests/concurrency_staging.py
