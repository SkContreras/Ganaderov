name: Web checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check service-worker.js
      - run: node --test tests/*.test.cjs tests/*.test.mjs
      - run: python3 -m py_compile tests/concurrency_staging.py tests/photo_concurrency_staging.py
      - run: python3 scripts/check-backend-release.py
      - run: python3 -m py_compile tests/integration/http_e2e.py scripts/check-backend-release.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/d4-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/d4-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Offline photo lifecycle in a real browser
        run: |
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/d4-browser/node_modules/playwright" node tests/browser/photo-d4.cjs
        env:
          D4_BROWSER_ARTIFACTS: ${{ runner.temp }}/d4-browser-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d4-browser-results
          path: ${{ runner.temp }}/d4-browser-results
          if-no-files-found: ignore

  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Start disposable Supabase
        run: |
          supabase init
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,inbucket
      - name: Install schema and exercise all operations
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          python3 scripts/check-backend-release.py --paths --include-base > "$RUNNER_TEMP/backend-sql-paths.txt"
          while IFS= read -r sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$sql"
          done < "$RUNNER_TEMP/backend-sql-paths.txt"
          psql -X -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
          psql -X -qAt -v ON_ERROR_STOP=1 -f scripts/supabase-audit.sql > "$RUNNER_TEMP/backend-audit.json"
          for sql in tests/sql/{event_rpc_audit,universal_operations,incremental_retention,security_hardening,photo_operations_d4}.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$sql"
          done
      - name: Concurrent authenticated writers
        env:
          GANADEROV_DISPOSABLE_DB: 'YES'
          GANADEROV_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          python -m pip install 'psycopg[binary]>=3.2,<4'
          python tests/concurrency_staging.py
          python tests/photo_concurrency_staging.py
      - name: Real Auth, PostgREST and Storage integration
        id: real_http
        env:
          GANADEROV_DISPOSABLE_DB: 'YES'
          GANADEROV_SUPABASE_STATUS: ${{ runner.temp }}/supabase-status.private.json
        run: |
          umask 077
          supabase status -o json > "$GANADEROV_SUPABASE_STATUS"
          python tests/integration/http_e2e.py --keep-fixtures --output "$RUNNER_TEMP/d234"
      - name: Install tools for real browser integration
        run: |
          npm install --prefix "$RUNNER_TEMP/d234-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/d234-browser/node_modules/.bin/playwright" install --with-deps chromium
          curl --fail --silent --show-error --location --retry 3 \
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js' \
            --output "$RUNNER_TEMP/supabase-2.49.8.js"
          printf '%s  %s\n' 'cf78f9ba72300e729e517e0f6b974a3bd282b600ba57fd59de448d50b1aab46f' "$RUNNER_TEMP/supabase-2.49.8.js" | sha256sum --check
      - name: Web UI with real Auth, RPC and Storage while offline and reconnecting
        id: web_ui
        env:
          GANADEROV_DISPOSABLE_HTTP: 'YES'
          GANADEROV_FIXTURES: ${{ runner.temp }}/d234/fixtures.private.json
          GANADEROV_WEB_ROOT: ${{ github.workspace }}
          GANADEROV_BROWSER_ARTIFACTS: ${{ runner.temp }}/d234/browser-artifacts
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/d234-browser/node_modules/playwright
          SUPABASE_JS_UMD: ${{ runner.temp }}/supabase-2.49.8.js
        run: node tests/integration/browser/run.cjs
      - name: Check out the exact Mobile consumer
        if: always() && steps.real_http.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: SkContreras/Ganaderov-Mobile
          ref: b566d7c11d5620f4411a2e7ea1da428706e8ccbd
          path: integration-mobile
          persist-credentials: false
      - name: Install Flutter for the real Mobile repository integration
        if: always() && steps.real_http.outcome == 'success'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - name: Flutter repository with the same Auth, RPC and Storage fixtures
        if: always() && steps.real_http.outcome == 'success'
        working-directory: integration-mobile
        env:
          GANADEROV_DISPOSABLE_HTTP: 'YES'
          GANADEROV_FIXTURES: ${{ runner.temp }}/d234/fixtures.private.json
          GANADEROV_WEB_BROWSER_REPORT: ${{ steps.web_ui.outcome == 'success' && format('{0}/d234/browser-artifacts/report.json', runner.temp) || '' }}
          GANADEROV_MOBILE_ARTIFACTS: ${{ runner.temp }}/d234/mobile-artifacts
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          flutter pub get --enforce-lockfile
          flutter test --no-pub "$GITHUB_WORKSPACE/tests/integration/mobile/d4_repository_real_test.dart" --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-integration-results
          path: |
            ${{ runner.temp }}/d234/http-report.json
            ${{ runner.temp }}/d234/browser-artifacts
            ${{ runner.temp }}/d234/mobile-artifacts
            ${{ runner.temp }}/backend-audit.json
          if-no-files-found: ignore
      - name: Remove temporary credentials and discard test services
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/supabase-status.private.json" "$RUNNER_TEMP/d234/fixtures.private.json"
          supabase stop --no-backup
